<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cart fixture</title>
<style>body{margin:0;color:#152238;background:#fff;font:16px Arial,sans-serif}main{max-width:48rem;margin:auto;padding:24px}button{font:inherit;padding:12px 20px;color:#fff;background:#173b67;border:0;border-radius:8px}button:focus-visible{outline:3px solid #bd5500;outline-offset:4px}</style>
</head><body><main><h1>Cart</h1><p>Three items cost 375 cents.</p><button id="submit" type="button">Confirm order</button><p id="status" role="status"></p></main>
<script>document.querySelector('#submit').addEventListener('click',()=>{document.querySelector('#status').textContent='Order confirmed';});</script></body></html>
