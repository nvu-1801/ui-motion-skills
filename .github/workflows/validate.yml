name: Validate skill kit
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: skill-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Package checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571
        with:
          node-version: '22'
      - run: python -m pip install -r tests/requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - shell: pwsh
        run: ./tests/test-installer.ps1
      - run: python scripts/build.py
  workflows:
    name: Workflow syntax and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: python -m pip install zizmor==1.32.0
      - shell: pwsh
        run: |
          $files = @((Get-Item .github/workflows/validate.yml).FullName) + @(Get-ChildItem .agents/skills -Recurse -Filter '*.yml' | Where-Object Name -ne 'semgrep.yml' | ForEach-Object FullName)
          $goRoot = go env GOPATH
          & (Join-Path $goRoot 'bin/actionlint') -shellcheck= -pyflakes= @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zizmor --offline --persona auditor --no-ignores @files
  portability:
    name: Cross-stack and UI regression fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/fixtures/web
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: tests/fixtures/web
      - run: python tests/run-portability.py --ui --offline-deps

      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/fixtures/ui-system
      - run: python tests/run-ui-reuse.py --ui --offline-deps
