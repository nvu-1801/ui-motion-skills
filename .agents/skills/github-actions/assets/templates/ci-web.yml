name: Quality
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Required quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@101b3474143230c3562bd21f0b3c3f8254784571
        with:
          node-version: '22'
      - run: npm ci
      - run: python .agents/skills/quality-workflow/scripts/check.py --validate-only
      - run: python .agents/skills/quality-workflow/scripts/check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: quality-report
          path: .quality/report.json
          if-no-files-found: warn
          retention-days: 7
